async function loadAlbum(slug,silent=false){try{const a=await api('/api/a/'+encodeURIComponent(slug));const was=album,change=!was||was.slug!==a.slug;album=a;document.title=a.title+' | Rebeca Fotografia';if(change){favorites=new Set(JSON.parse(localStorage.getItem(favoriteKey())||'[]'));selected.clear();selectMode=false;tab='photos';category='all';renderAlbum()}else if(JSON.stringify(was.media)!==JSON.stringify(a.media)||JSON.stringify({...was,media:[]})!==JSON.stringify({...a,media:[]})){renderAlbum(true);if(!silent)toast('Álbum atualizado')}if(!interval)interval=setInterval(()=>{if(album&&document.visibilityState==='visible')loadAlbum(album.slug,true)},15000)}catch(e){if(e.status===403)renderAlbumGate(slug,e.data?.title);else app.innerHTML='<div class="auth"><h1>Álbum não encontrado</h1><p>Confira seu link e tente novamente.</p></div>'}}
