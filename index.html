<script src="./static-engine.js"></script><script>
const $=s=>document.querySelector(s),app=$('#app');let album=null,tab='photos',selected=new Set(),favorites=new Set(),selectMode=false,lightIndex=-1,visible=[],lastTouch=0,interval=null,editSlug='',adminAlbums=[];
const icons={heart:'<svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></svg>',download:'<svg viewBox="0 0 24 24"><path d="M12 3v13m-5-5 5 5 5-5M4 17v4h16v-4"/></svg>',check:'<svg viewBox="0 0 24 24"><path d="m4 12 5 5L20 6"/></svg>',close:'<svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19"/></svg>',play:'<svg viewBox="0 0 24 24"><path d="m8 5 12 7-12 7z"/></svg>'};
const escapeHTML=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove('show'),2400)}
function mediaUrl(name){return window.booksMedia(album.slug,name)}
function favoriteKey(){return 'rebeca-favs-'+album.slug}
function syncFav(){try{localStorage.setItem(favoriteKey(),JSON.stringify([...favorites]))}catch{}}
async function api(url,options={}){return window.booksApi(url,options)}
function go(){const p=new URLSearchParams(location.search);if(p.has('admin'))renderAdmin();else if(p.has('album'))loadAlbum(p.get('album'));else renderLanding()}
function renderLanding(){app.innerHTML='<section class="hero placeholderHero"><div class="heroContent"><div class="eyebrow">Rebeca Fotografia</div><h1>Histórias que ficam.</h1><p>Uma experiência feita para recordar</p></div></section><div class="shell"><div class="intro"><div class="eyebrow">GALERIA PRIVADA</div><h2>Suas memórias, em um lugar especial.</h2><p>Abra o link exclusivo compartilhado com você para acessar suas fotografias.</p></div></div><div class="footer"><b>Rebeca Fotografia</b>Feito para sentir de novo.</div>'}
async function loadAlbum(slug,silent=false){try{const a=await api('/api/a/'+encodeURIComponent(slug));const was=album,change=!was||was.slug!==a.slug;album=a;document.title=a.title+' | Rebeca Fotografia';if(change){favorites=new Set(JSON.parse(localStorage.getItem(favoriteKey())||'[]'));selected.clear();selectMode=false;tab='photos';renderAlbum()}else if(JSON.stringify(was.media)!==JSON.stringify(a.media)||JSON.stringify({...was,media:[]})!==JSON.stringify({...a,media:[]})){renderAlbum(true);if(!silent)toast('Álbum atualizado')}if(!interval)interval=setInterval(()=>{if(album&&document.visibilityState==='visible')loadAlbum(album.slug,true)},15000)}catch(e){if(e.status===403)renderAlbumGate(slug,e.data?.title);else app.innerHTML='<div class="auth"><h1>Álbum não encontrado</h1><p>Confira seu link e tente novamente.</p></div>'}}
function renderAlbumGate(slug,title){app.innerHTML='<div class="auth"><span class="eyebrow">ACESSO EXCLUSIVO</span><h1>'+escapeHTML(title||'Seu álbum')+'</h1><p class="adminHint">Digite a senha enviada pela fotógrafa para ver suas memórias.</p><form class="form" id="gate"><label>Senha do álbum<input name="password" type="password" required autocomplete="current-password"></label><button class="pill dark">Entrar no álbum</button></form></div>';$('#gate').onsubmit=async e=>{e.preventDefault();try{await api('/api/a/'+slug+'/access',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:e.target.elements.namedItem('password').value})});loadAlbum(slug)}catch(err){toast(err.message)}}}
function coverNode(){const chosen=album.videoCover||album.cover,url=chosen&&album.media.some(i=>i.name===chosen)?mediaUrl(chosen):'';if(!url)return '';return album.videoCover&&chosen===album.videoCover?'<video autoplay muted loop playsinline poster="" src="'+url+'"></video>':'<img src="'+url+'" alt="Capa do álbum">'}
function renderAlbum(preserveScroll=false){const y=scrollY;app.innerHTML='<section class="hero '+(coverNode()?'':'placeholderHero')+'">'+coverNode()+'<div class="heroContent"><div class="eyebrow">REBECA FOTOGRAFIA · GALERIA EXCLUSIVA</div><h1 id="heroTitle">'+escapeHTML(album.title)+'</h1><p>'+escapeHTML(album.subtitle||'Uma história para sempre')+'</p></div><div class="scrollhint">DESLIZE PARA EXPLORAR ↓</div></section><div class="shell"><div class="intro"><div class="eyebrow">SUAS MEMÓRIAS</div><h2>Para reviver cada instante.</h2><p>Toque para ampliar, deslize para explorar e guarde seus favoritos.</p></div><div class="toolbar"><div class="tabs"><button class="tab" data-tab="photos">Fotos</button><button class="tab" data-tab="videos">Vídeos</button><button class="tab" data-tab="favorites">Favoritos</button></div><div class="actions"><span class="count" id="count"></span><button class="pill" id="selectToggle">'+(selectMode?'Cancelar':'Selecionar')+'</button><button class="pill" id="allToggle" style="display:none">Todas</button><button class="pill dark" id="batchDownload" style="display:none">Baixar (0)</button></div></div><div id="gallery"></div></div><div class="footer"><b>Rebeca Fotografia</b>MEMÓRIAS QUE FICAM</div>';const h=$('#heroTitle');h.style.fontFamily=album.font==='sans'?'Manrope, sans-serif':album.font==='display'?'DM Sans, sans-serif':'Playfair Display, serif';h.style.fontSize='clamp('+Math.round(44*album.scale)+'px,'+(8*album.scale)+'vw,'+Math.round(125*album.scale)+'px)';document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;selected.clear();renderGrid()});$('#selectToggle').onclick=()=>{selectMode=!selectMode;selected.clear();renderGrid()};$('#allToggle').onclick=()=>{if(selected.size===visible.length)selected.clear();else visible.forEach(x=>selected.add(x.name));renderGrid()};$('#batchDownload').onclick=()=>downloadSelected();renderGrid();if(preserveScroll)scrollTo(0,y)}
function renderGrid(){visible=album.media.filter(x=>tab==='photos'?x.type==='photo':tab==='videos'?x.type==='video':favorites.has(x.name));document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#count').textContent=visible.length+' '+(visible.length===1?'arquivo':'arquivos');$('#selectToggle').textContent=selectMode?'Cancelar':'Selecionar';$('#allToggle').style.display=selectMode?'inline-flex':'none';$('#allToggle').textContent=visible.length&&visible.every(x=>selected.has(x.name))?'Desmarcar todas':'Selecionar todas';$('#batchDownload').style.display=selected.size?'inline-flex':'none';$('#batchDownload').textContent='Baixar ('+selected.size+')';const g=$('#gallery');g.className=visible.length?'grid':'empty';g.innerHTML=visible.length?visible.map((m,i)=>'<article class="tile '+(selected.has(m.name)?'selected':'')+'" data-i="'+i+'" tabindex="0" aria-label="'+escapeHTML(m.name)+'">'+(m.type==='video'?'<video preload="metadata" muted playsinline src="'+mediaUrl(m.name)+'#t=0.1"></video>':'<img loading="lazy" decoding="async" src="'+mediaUrl(m.name)+'" alt="Foto '+(i+1)+'">')+'<div class="tileOverlay"><span class="check" style="visibility:'+(selectMode?'visible':'hidden')+'">'+(selected.has(m.name)?icons.check:'')+'</span><button class="heart '+(favorites.has(m.name)?'active':'')+'" data-action="fav" aria-label="Favoritar">'+icons.heart+'</button></div><div class="tileFooter"><button data-action="download" title="Baixar" aria-label="Baixar">'+icons.download+'</button></div>'+(m.type==='video'?'<span class="videoTag">▶ FILME</span>':'')+'</article>').join(''):'<div>'+icons.heart+'<p>'+(tab==='favorites'?'Suas fotos favoritas aparecerão aqui.':'Nenhuma mídia nesta seção ainda.')+'</p></div>';
 g.querySelectorAll('.tile').forEach(tile=>{const i=Number(tile.dataset.i),m=visible[i];let timer=null,long=false;tile.addEventListener('touchstart',()=>{long=false;timer=setTimeout(()=>{long=true;selectMode=true;selected.add(m.name);navigator.vibrate?.(25);renderGrid()},500)},{passive:true});['touchmove','touchend','touchcancel'].forEach(ev=>tile.addEventListener(ev,()=>clearTimeout(timer),{passive:true}));tile.onclick=e=>{const action=e.target.closest('[data-action]')?.dataset.action;if(action==='fav'){toggleFav(m.name);return}if(action==='download'){download(m.name);return}if(long)return;if(selectMode){selected.has(m.name)?selected.delete(m.name):selected.add(m.name);renderGrid()}else openLight(i)};tile.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();tile.click()}}})}
function toggleFav(name){favorites.has(name)?favorites.delete(name):favorites.add(name);syncFav();renderGrid();if(lightIndex>=0)updateLightButtons()}
async function download(name){try{const r=await fetch(mediaUrl(name));if(!r.ok)throw Error('Arquivo ainda não publicado.');const url=URL.createObjectURL(await r.blob()),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);toast('Download iniciado')}catch(e){toast(e.message)}}
async function downloadSelected(){const names=[...selected];if(names.length===1){download(names[0]);return}try{toast('Preparando suas fotos…');const blob=await window.booksZip(album.slug,names),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='rebeca-fotografia.zip';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);toast('Download preparado')}catch(e){toast(e.message)}}
function openLight(i){lightIndex=i;$('#lightbox').classList.add('open');document.body.style.overflow='hidden';drawLight()}
function drawLight(){if(lightIndex<0)return;const m=visible[lightIndex];if(!m){closeLight();return}$('#lightFigure').innerHTML=m.type==='video'?'<video controls autoplay playsinline src="'+mediaUrl(m.name)+'"></video>':'<img src="'+mediaUrl(m.name)+'" alt="'+escapeHTML(m.name)+'">';$('#position').textContent=(lightIndex+1)+' / '+visible.length;updateLightButtons()}
function updateLightButtons(){const m=visible[lightIndex];if(!m)return;$('#lightHeart').innerHTML=icons.heart;$('#lightHeart').classList.toggle('active',favorites.has(m.name))}
function moveLight(n){if(lightIndex<0)return;lightIndex=(lightIndex+n+visible.length)%visible.length;drawLight()}
function closeLight(){lightIndex=-1;$('#lightbox').classList.remove('open');$('#lightFigure').innerHTML='';document.body.style.overflow=''}
$('#closeLight').onclick=closeLight;$('#prev').onclick=()=>moveLight(-1);$('#next').onclick=()=>moveLight(1);$('#lightHeart').onclick=()=>{const m=visible[lightIndex];if(m){favorites.has(m.name)?favorites.delete(m.name):favorites.add(m.name);syncFav();updateLightButtons()}};$('#lightDownload').onclick=()=>{const m=visible[lightIndex];if(m)download(m.name)};$('#lightbox').addEventListener('click',e=>{if(e.target===$('#lightbox'))closeLight()});document.addEventListener('keydown',e=>{if(lightIndex<0)return;if(e.key==='Escape')closeLight();if(e.key==='ArrowLeft')moveLight(-1);if(e.key==='ArrowRight')moveLight(1)});let startX=0,startY=0;$('#lightbox').addEventListener('touchstart',e=>{startX=e.touches[0].clientX;startY=e.touches[0].clientY},{passive:true});$('#lightbox').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.4)moveLight(dx<0?1:-1)},{passive:true});
async function renderAdmin(){try{const d=await api('/api/admin/albums');adminAlbums=d.albums;renderPanel()}catch(e){app.innerHTML='<div class="auth"><span class="eyebrow">STUDIO · ACESSO RESTRITO</span><h1>Seu painel.</h1><p class="adminHint">Cole um token fine-grained do GitHub com permissão Contents: Read/Write apenas para rebecafotografia/books. Ele fica somente nesta aba e nunca é enviado aos visitantes.</p><form id="adminLogin" class="form"><label>Token GitHub (fine-grained, Contents: Read/Write)<input name="password" type="password" required autocomplete="off"></label><button class="pill dark">Acessar painel</button></form></div>';$('#adminLogin').onsubmit=async ev=>{ev.preventDefault();try{await api('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:ev.target.elements.namedItem('password').value})});renderAdmin()}catch(err){toast(err.message)}}}}
function renderPanel(){const current=adminAlbums.find(x=>x.slug===editSlug)||null;app.innerHTML='<section class="panel"><div class="panelhead"><div><span class="eyebrow">REBECA FOTOGRAFIA / STUDIO</span><h1>Gerenciar álbuns</h1></div><a class="pill" href="/">Ver site</a></div><div class="adminGrid"><aside class="adminBox"><h2>Seus álbuns</h2><div id="albumList">'+adminAlbums.map(a=>'<div class="albumItem"><button data-slug="'+escapeHTML(a.slug)+'"><strong>'+escapeHTML(a.title)+'</strong><small>'+a.media.length+' arquivos · '+escapeHTML(a.slug)+'</small></button><a href="?album='+encodeURIComponent(a.slug)+'" target="_blank" aria-label="Abrir álbum">↗</a></div>').join('')+'</div><button class="pill dark" id="newAlbum" style="margin-top:19px">+ Novo álbum</button></aside><div class="adminBox"><h2 id="editTitle">'+(current?'Editar álbum':'Novo álbum')+'</h2><form id="albumForm" class="form"><label>Identificador do álbum (link)<input name="slug" required pattern="[a-z0-9_-]+" value="'+escapeHTML(current?.slug||'')+'" '+(current?'readonly':'')+' placeholder="mariana-e-lucas"></label><label>Título de capa<input name="title" required value="'+escapeHTML(current?.title||'')+'" placeholder="Mariana & Lucas"></label><label>Subtítulo<input name="subtitle" value="'+escapeHTML(current?.subtitle||'')+'" placeholder="O nosso grande dia"></label><label>Fonte do título<select name="font"><option value="serif">Editorial / Serifada</option><option value="sans">Minimalista / Sans</option><option value="display">Contemporânea / Display</option></select></label><label>Escala do título <input name="scale" type="range" min=".7" max="1.5" step=".05" value="'+(current?.scale||1)+'"></label><label>Imagem de capa (nome exato do arquivo)<input name="cover" value="'+escapeHTML(current?.cover||'')+'" placeholder="capa.jpg"></label><label>Vídeo de capa (nome exato, priorizado)<input name="videoCover" value="'+escapeHTML(current?.videoCover||'')+'" placeholder="capa.mp4"></label><label style="display:flex;align-items:center;gap:8px"><input type="checkbox" name="private" '+(current?.private?'checked':'')+'> Exigir senha do cliente</label><label>Senha do cliente <input name="password" type="password" placeholder="'+(current?'Deixe vazio para manter':'Obrigatória se for privado')+'"></label><button class="pill dark">Salvar álbum</button></form>'+(current?'<div style="margin-top:35px"><h2>Fotos e vídeos</h2><label class="fileInput">＋ Toque para enviar arquivos<br><small>JPG, PNG, WEBP, MP4 e outros · até 65 MB por arquivo<input type="file" id="upload" multiple accept="image/*,video/mp4,video/webm,video/quicktime"></small></label><p id="uploadStatus" class="adminHint"></p><p class="adminHint">Também é possível colocar arquivos diretamente em <code>data/albums/'+escapeHTML(current.slug)+'/</code>. Eles aparecem automaticamente na galeria.</p><div class="adminMedia">'+current.media.map(m=>'<div class="mini">'+(m.type==='photo'?'<img loading="lazy" src="'+window.booksMedia(current.slug,m.name)+'">':'<video muted src="'+window.booksMedia(current.slug,m.name)+'"></video>')+'<button title="Excluir" data-delete="'+escapeHTML(m.name)+'">×</button></div>').join('')+'</div><p class="adminHint">Link do cliente: <a href="?album='+encodeURIComponent(current.slug)+'" target="_blank"><u>?album='+escapeHTML(current.slug)+'</u></a></p></div>':'')+'</div></div></section>';
 if(current)$('#albumForm').elements.namedItem('font').value=current.font;
 document.querySelectorAll('[data-slug]').forEach(b=>b.onclick=()=>{editSlug=b.dataset.slug;renderPanel()});$('#newAlbum').onclick=()=>{editSlug='';renderPanel()};
 $('#albumForm').onsubmit=async e=>{e.preventDefault();const f=e.target.elements,b={slug:f.namedItem('slug').value.toLowerCase().trim(),title:f.namedItem('title').value,subtitle:f.namedItem('subtitle').value,font:f.namedItem('font').value,scale:Number(f.namedItem('scale').value),cover:f.namedItem('cover').value,videoCover:f.namedItem('videoCover').value,private:f.namedItem('private').checked,password:f.namedItem('password').value};try{await api('/api/admin/album',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)});editSlug=b.slug;toast('Álbum salvo');renderAdmin()}catch(err){toast(err.message)}};
 if(current){$('#upload').onchange=async e=>{const files=[...e.target.files];let ok=0;for(const file of files){$('#uploadStatus').textContent='Enviando '+(ok+1)+' de '+files.length+': '+file.name;try{await api('/api/admin/upload?album='+encodeURIComponent(current.slug)+'&name='+encodeURIComponent(file.name),{method:'POST',headers:{'content-type':file.type||'application/octet-stream'},body:file});ok++}catch(err){toast(file.name+': '+err.message)}}toast(ok+' arquivo(s) enviado(s)');renderAdmin()};document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('Excluir '+b.dataset.delete+' permanentemente?'))return;try{await api('/api/admin/delete',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({slug:current.slug,name:b.dataset.delete})});renderAdmin()}catch(err){toast(err.message)}})}}
go();
</script></body></html>
